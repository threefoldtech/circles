[package]
name = "circle"
version = "0.1.0"
edition = "2024"
description = "Circle-Based Collaboration System"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
# GUI framework
egui = "0.31.1"
eframe = "0.31.1"

# Data handling
uuid = { version = "1.6.1", features = ["v4", "serde"] }
chrono = { version = "0.4.31", features = ["serde"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"

# Logging
log = "0.4.20"
env_logger = "0.10.1"
chrono-tz = "0.10.3"
icalendar = "0.16.13"
reqwest = "0.12.15"
egui_extras = "0.31.1"
rfd = "0.15.3"
notify-rust = "4.11.7"
open = "5.3.2"
time = "0.3.41"
dark-light = "1.0.0"

# For web support
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.68", features = ["Window", "MediaQueryList"] }
